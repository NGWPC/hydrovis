product: mrf_nbm_10day_max_coastal_inundation
configuration: medium_range_blend_coastal
product_type: "fim"
published_format: "tif"
run: true

fim_configs:
  - name: mrf_nbm_10day_max_zonal_coastal_inundation_atlgulf
    target_table: ingest.mrf_nbm_10day_max_zonal_coastal_inundation_atlgulf
    fim_type: zonal_coastal
    domain: atlgulf
    forecast_type: mrf_nbm_10day
    sql_file: zonal_coastal_atlgulf
    preprocess:
        file_format: common/data/model/com/nwm/{{variable:NWM_DATAFLOW_VERSION}}/nwm.{{datetime:%Y%m%d}}/medium_range_blend_coastal_atlgulf/nwm.t{{datetime:%H}}z.medium_range_blend_coastal.total_water.f{{range:3,241,3,%03d}}.atlgulf.nc
        file_step: None
        file_window: None
        product: max_values
        output_file: max_elevs/medium_range_blend_coastal_atlgulf/{{datetime:%Y%m%d}}/mrf_nbm_coastal_atlgulf_10day_{{datetime:%H}}_max_elevs.nc
  
      
postprocess_sql:
  - sql_file: mrf_nbm_10day_max_zonal_coastal_inundation
    target_table: publish.mrf_nbm_10day_max_zonal_coastal_inundation_atlgulf

services:
  - mrf_nbm_10day_max_zonal_coastal_inundation_extent_noaa