product: ana_coastal_inundation
configuration: analysis_assim_coastal
product_type: "fim"
published_format: "tif"
run: true

fim_configs:
  - name: ana_zonal_coastal_inundation_atlgulf
    target_table: ingest.ana_zonal_coastal_inundation_atlgulf
    fim_type: zonal_coastal
    domain: atlgulf
    forecast_type: ana
    sql_file: ana_zonal_coastal_atlgulf_dev
    preprocess:
        file_format: common/data/model/com/nwm/{{variable:NWM_DATAFLOW_VERSION}}/nwm.{{datetime:%Y%m%d}}/analysis_assim_coastal_atlgulf/nwm.t{{datetime:%H}}z.analysis_assim_coastal.total_water.tm00.atlgulf.nc
        file_step: None
        file_window: None
        product: max_values
        output_file: max_elevs/analysis_assim_coastal_atlgulf/{{datetime:%Y%m%d}}/ana_coastal_atlgulf_{{datetime:%H}}_max_elevs.nc
     
postprocess_sql:
  - sql_file: ana_zonal_coastal_inundation_atlgulf
    target_table: publish.ana_zonal_coastal_inundation_atlgulf

services:
  - ana_zonal_coastal_inundation_extent_noaa